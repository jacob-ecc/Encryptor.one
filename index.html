<!doctype html>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">
      <svg class="brand-mark" aria-hidden="true"><use href="#i-seal"/></svg>
      <span class="brand-name">encryptor<i>.one</i></span>
    </span>
    <div class="topbar-actions">
      <button type="button" id="btnLang" class="pill-btn" aria-label="Sprache / Language">DE</button>
      <button type="button" id="btnTheme" class="icon-btn" data-i18n-label="action.theme">
        <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>

        <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>

<main id="main">

  <!-- ============ LANDING ============ -->
  <section id="screen-landing" class="screen">
    <div class="hero">
      <div class="hero-seal" id="heroSeal" aria-hidden="true"></div>
      <p class="eyebrow" data-i18n="landing.eyebrow"></p>
      <h1 class="hero-title" id="heroTitle" data-i18n="landing.title"></h1>
      <p class="hero-tagline mono" data-i18n="app.tagline"></p>
      <p class="lede" data-i18n="landing.lede"></p>
      <div class="hero-actions">
        <button type="button" id="btnCreate" class="btn btn-primary btn-lg" data-i18n="landing.cta.create"></button>
        <button type="button" id="btnHow" class="btn btn-quiet btn-lg" data-i18n="landing.cta.how"></button>
      </div>
      <p class="hero-note"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-shield"/></svg><span data-i18n="landing.offline"></span></p>
      <button type="button" id="btnRestoreLanding" class="linklike linklike-quiet" data-i18n="unlock.restore"></button>
    </div>

    <div class="facts">
      <article class="fact">
        <svg class="icon" aria-hidden="true"><use href="#i-key"/></svg>
        <h3 data-i18n="landing.f1.t"></h3><p data-i18n="landing.f1.d"></p>
      </article>
      <article class="fact">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
        <h3 data-i18n="landing.f2.t"></h3><p data-i18n="landing.f2.d"></p>
      </article>
      <article class="fact">
        <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>
        <h3 data-i18n="landing.f3.t"></h3><p data-i18n="landing.f3.d"></p>
      </article>
    </div>

    <div id="howtoSlotLanding" class="howto-slot"></div>

    <div id="securitySlotLanding" class="howto-slot"></div>
  </section>

  <!-- ============ UNLOCK ============ -->
  <section id="screen-lock" class="screen" hidden>
    <div class="panel panel-narrow lock-panel">
      <div class="lock-seal" id="lockSeal" aria-hidden="true"></div>
      <h2 class="panel-title" data-i18n="unlock.title"></h2>
      <p class="muted" data-i18n="unlock.sub"></p>
      <form id="unlockForm" class="stack" novalidate>
        <div class="field">
          <label class="label" for="unlockPass" data-i18n="setup.pass"></label>
          <div class="input-affix">
            <input type="password" id="unlockPass" class="input" autocomplete="current-password"
                   autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-placeholder="setup.pass.ph">
            <button type="button" class="affix-btn" data-toggle-visibility="unlockPass" aria-label="Passphrase anzeigen">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-eye"/></svg>
            </button>
          </div>
        </div>
        <p class="form-error" id="unlockError" role="alert" hidden></p>
        <button type="submit" id="unlockSubmit" class="btn btn-primary btn-block" data-i18n="unlock.submit"></button>
      </form>
      <div class="lock-links">
        <button type="button" id="btnRestore" class="linklike" data-i18n="unlock.restore"></button>
        <button type="button" id="btnForgot" class="linklike linklike-quiet" data-i18n="unlock.forgot"></button>
      </div>
    </div>
  </section>

  <!-- ============ APP ============ -->
  <section id="screen-app" class="screen" hidden>

    <nav class="tabs" id="tabs" aria-label="Bereiche">
      <button type="button" class="tab is-active" data-view="encrypt">
        <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span data-i18n="nav.encrypt"></span>
      </button>
      <button type="button" class="tab" data-view="decrypt">
        <svg class="icon" aria-hidden="true"><use href="#i-unlock"/></svg><span data-i18n="nav.decrypt"></span>
      </button>
      <button type="button" class="tab" data-view="contacts">
        <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span data-i18n="nav.contacts"></span>
      </button>
      <button type="button" class="tab" data-view="guide">
        <svg class="icon" aria-hidden="true"><use href="#i-compass"/></svg><span data-i18n="nav.guide"></span>
      </button>
    </nav>

    <!-- ---- Verschlüsseln ---- -->
    <div class="view" id="view-encrypt">
      <div class="panel">
        <div class="field">
          <label class="label" for="recipient" data-i18n="enc.to"></label>
          <select id="recipient" class="input select"></select>
          <p class="hint" id="encNoContacts" data-i18n="enc.nocontacts" hidden></p>
        </div>
        <details class="disclosure" id="manualKeyBox">
          <summary data-i18n="enc.manual"></summary>
          <input type="text" id="manualKey" class="input mono" autocapitalize="off" autocorrect="off"
                 spellcheck="false" data-i18n-placeholder="enc.manual.ph">
        </details>
        <div class="field">
          <label class="label" for="plainInput" data-i18n="enc.msg"></label>
          <textarea id="plainInput" class="input textarea" rows="6" data-i18n-placeholder="enc.msg.ph"></textarea>
          <p class="counter" id="plainCounter">0</p>
        </div>
        <button type="button" id="btnEncrypt" class="btn btn-primary btn-block">
          <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span data-i18n="enc.button"></span>
        </button>
        <p class="form-error" id="encError" role="alert" hidden></p>
      </div>

      <div class="panel result-panel" id="encResult" hidden>
        <div class="result-head">
          <p class="eyebrow" data-i18n="enc.result"></p>
          <p class="result-status" id="encStatus"></p>
        </div>
        <textarea id="cipherOutput" class="input textarea mono cipher" rows="5" readonly></textarea>
        <p class="hint" data-i18n="enc.hint"></p>
        <div class="btn-row">
          <button type="button" id="btnCopyCipher" class="btn btn-primary">
            <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="action.copy"></span>
          </button>
          <button type="button" id="btnShareCipher" class="btn btn-quiet" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="action.share"></span>
          </button>
          <button type="button" id="btnEncAgain" class="btn btn-quiet" data-i18n="enc.again"></button>
        </div>
        <p class="hint subtle"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-i18n="enc.fsNote"></span></p>
      </div>
    </div>

    <!-- ---- Entschlüsseln ---- -->
    <div class="view" id="view-decrypt" hidden>
      <div class="panel">
        <div class="field">
          <label class="label" for="cipherInput" data-i18n="dec.paste"></label>
          <textarea id="cipherInput" class="input textarea mono" rows="6" autocapitalize="off" autocorrect="off"
                    spellcheck="false" data-i18n-placeholder="dec.paste.ph"></textarea>
        </div>
        <button type="button" id="btnDecrypt" class="btn btn-primary btn-block">
          <svg class="icon" aria-hidden="true"><use href="#i-unlock"/></svg><span data-i18n="dec.button"></span>
        </button>
        <p class="form-error" id="decError" role="alert" hidden></p>
      </div>

      <div class="panel result-panel" id="decResult" hidden>
        <p class="eyebrow" data-i18n="dec.from"></p>
        <div class="sender" id="decSender"></div>
        <p class="eyebrow" data-i18n="dec.plain"></p>
        <div class="plain-out" id="plainOutput"></div>
        <p class="hint" id="decMeta"></p>
        <div class="btn-row">
          <button type="button" id="btnCopyPlain" class="btn btn-quiet">
            <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="action.copy"></span>
          </button>
          <button type="button" id="btnDecAgain" class="btn btn-quiet" data-i18n="dec.again"></button>
        </div>
      </div>
    </div>

    <!-- ---- Kontakte ---- -->
    <div class="view" id="view-contacts" hidden>
      <div class="panel identity-panel">
        <p class="eyebrow" data-i18n="con.you"></p>
        <div class="identity">
          <div class="identity-seal" id="mySeal"></div>
          <div class="identity-body">
            <p class="label-sm" data-i18n="con.fingerprint"></p>
            <p class="fingerprint" id="myFingerprint"></p>
          </div>
        </div>
        <div class="btn-row">
          <button type="button" id="btnCopyCard" class="btn btn-primary">
            <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="con.copyCard"></span>
          </button>
          <button type="button" id="btnShareCard" class="btn btn-quiet" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="action.share"></span>
          </button>
          <button type="button" id="btnCopyLink" class="btn btn-quiet">
            <svg class="icon" aria-hidden="true"><use href="#i-link"/></svg><span data-i18n="con.copyLink"></span>
          </button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <p class="eyebrow" data-i18n="con.list"></p>
          <button type="button" id="btnAddContact" class="btn btn-small btn-primary">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="con.add"></span>
          </button>
        </div>
        <ul class="contact-list" id="contactList"></ul>
        <p class="empty" id="contactEmpty" data-i18n="con.empty"></p>
      </div>
    </div>

    <!-- ---- Anleitung ---- -->
    <div class="view" id="view-guide" hidden>
      <div id="howtoSlotApp" class="howto-slot"></div>
      <div id="securitySlotApp" class="howto-slot"></div>
    </div>
  </section>
</main>

<!-- ============ Bausteine, die zwischen Landing und Tab wandern ============ -->
<div id="componentStore" hidden>
<div id="howto" class="panel howto">
  <p class="eyebrow" data-i18n="guide.title"></p>
  <p class="lede lede-sm" data-i18n="guide.lede"></p>

  <ol class="steps" id="steps">
    <li class="step is-active" data-step="1">
      <figure class="scene">
        <svg viewBox="0 0 320 150" role="img" aria-hidden="true">
          <g class="sc-devices">
            <g class="sc-dev sc-dev-a">
              <rect x="66" y="27" width="60" height="96" rx="11"/>
              <circle class="sc-seal" cx="96" cy="75" r="17"/>
              <circle class="sc-core" cx="96" cy="75" r="3"/>
            </g>
            <g class="sc-dev sc-dev-b">
              <rect x="194" y="27" width="60" height="96" rx="11"/>
              <circle class="sc-seal" cx="224" cy="75" r="17"/>
              <circle class="sc-core" cx="224" cy="75" r="3"/>
            </g>
          </g>
          <path class="sc-dash" d="M136 75h48"/>
        </svg>
      </figure>
      <div class="step-body">
        <p class="step-index" data-step-index="1"></p>
        <h3 data-i18n="guide.s1.t"></h3>
        <p data-i18n="guide.s1.d"></p>
      </div>
    </li>

    <li class="step" data-step="2">
      <figure class="scene">
        <svg viewBox="0 0 320 150" role="img" aria-hidden="true">
          <rect class="sc-dev-plain" x="26" y="35" width="52" height="80" rx="10"/>
          <rect class="sc-dev-plain" x="242" y="35" width="52" height="80" rx="10"/>
          <path class="sc-dash" d="M84 75h152"/>
          <g class="sc-travel">
            <rect class="sc-card" x="-32" y="-15" width="64" height="30" rx="7"/>
            <path class="sc-card-line" d="M-20 -4h40M-20 4h24"/>
          </g>
        </svg>
      </figure>
      <div class="step-body">
        <p class="step-index" data-step-index="2"></p>
        <h3 data-i18n="guide.s2.t"></h3>
        <p data-i18n="guide.s2.d"></p>
      </div>
    </li>

    <li class="step" data-step="3">
      <figure class="scene">
        <svg viewBox="0 0 320 150" role="img" aria-hidden="true">
          <g class="sc-cmp sc-cmp-a">
            <circle class="sc-seal" cx="96" cy="70" r="30"/>
            <circle class="sc-core" cx="96" cy="70" r="4"/>
            <path class="sc-fp" d="M76 108h40"/>
          </g>
          <g class="sc-cmp sc-cmp-b">
            <circle class="sc-seal" cx="224" cy="70" r="30"/>
            <circle class="sc-core" cx="224" cy="70" r="4"/>
            <path class="sc-fp" d="M204 108h40"/>
          </g>
          <path class="sc-check" d="M146 70l10 11 18-22"/>
        </svg>
      </figure>
      <div class="step-body">
        <p class="step-index" data-step-index="3"></p>
        <h3 data-i18n="guide.s3.t"></h3>
        <p data-i18n="guide.s3.d"></p>
      </div>
    </li>

    <li class="step" data-step="4">
      <figure class="scene">
        <svg viewBox="0 0 320 150" role="img" aria-hidden="true">
          <g class="sc-plain">
            <path d="M40 52h84M40 66h68M40 80h78M40 94h52"/>
          </g>
          <g class="sc-lockmark">
            <rect x="146" y="60" width="28" height="20" rx="4"/>
            <path class="sc-shackle" d="M153 60v-6a7 7 0 0 1 14 0v6"/>
          </g>
          <g class="sc-cipher">
            <path d="M196 52h84M196 66h84M196 80h84M196 94h60"/>
          </g>
        </svg>
      </figure>
      <div class="step-body">
        <p class="step-index" data-step-index="4"></p>
        <h3 data-i18n="guide.s4.t"></h3>
        <p data-i18n="guide.s4.d"></p>
      </div>
    </li>

    <li class="step" data-step="5">
      <figure class="scene">
        <svg viewBox="0 0 320 150" role="img" aria-hidden="true">
          <rect class="sc-dev-plain" x="26" y="35" width="52" height="80" rx="10"/>
          <rect class="sc-dev-plain" x="242" y="35" width="52" height="80" rx="10"/>
          <g class="sc-bubble">
            <rect x="-40" y="-17" width="80" height="34" rx="10"/>
            <path class="sc-noise" d="M-28 -5h56M-28 5h34"/>
          </g>
          <g class="sc-reveal">
            <path d="M252 62h32M252 74h32M252 86h20"/>
          </g>
        </svg>
      </figure>
      <div class="step-body">
        <p class="step-index" data-step-index="5"></p>
        <h3 data-i18n="guide.s5.t"></h3>
        <p data-i18n="guide.s5.d"></p>
      </div>
    </li>
  </ol>

  <div class="steps-nav">
    <button type="button" id="stepPrev" class="icon-btn" data-i18n-label="guide.prev">
      <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
    </button>
    <div class="dots" id="stepDots" role="tablist"></div>
    <button type="button" id="stepNext" class="icon-btn" data-i18n-label="guide.next">
      <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
    </button>
  </div>
</div>

<!-- ============ Sicherheitshinweise ============ -->
<div id="securityNote" class="panel security">
  <p class="eyebrow" data-i18n="sec.title"></p>
  <div class="sec-grid">
    <div>
      <h3 class="sec-h sec-yes"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="sec.does"></span></h3>
      <ul class="sec-list">
        <li data-i18n="sec.d1"></li><li data-i18n="sec.d2"></li><li data-i18n="sec.d3"></li>
      </ul>
    </div>
    <div>
      <h3 class="sec-h sec-no"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-i18n="sec.doesnt"></span></h3>
      <ul class="sec-list">
        <li data-i18n="sec.n1"></li><li data-i18n="sec.n2"></li><li data-i18n="sec.n3"></li><li data-i18n="sec.n4"></li>
      </ul>
    </div>
  </div>
  <p class="stack-line mono" data-i18n="sec.stack"></p>
</div>

</div><!-- /componentStore -->

<!-- ============ Dialoge ============ -->

<dialog id="dlgSetup" class="sheet">
  <div class="sheet-head">
    <h2 data-i18n="setup.title"></h2>
    <button type="button" class="icon-btn" data-close data-i18n-label="action.close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <form id="setupForm" class="sheet-body stack" novalidate>
    <p class="muted" data-i18n="setup.intro"></p>
    <div class="field">
      <label class="label" for="setupPass" data-i18n="setup.pass"></label>
      <div class="input-affix">
        <input type="password" id="setupPass" class="input" autocomplete="new-password" autocapitalize="off"
               autocorrect="off" spellcheck="false" data-i18n-placeholder="setup.pass.ph">
        <button type="button" class="affix-btn" data-toggle-visibility="setupPass" aria-label="Passphrase anzeigen">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-eye"/></svg>
        </button>
      </div>
      <div class="meter"><div class="meter-bar" id="passMeter"></div></div>
      <p class="hint" id="passStrength"></p>
      <div class="btn-row btn-row-tight">
        <button type="button" id="btnSuggestPass" class="linklike" data-i18n="setup.generate"></button>
        <button type="button" id="btnCopyPass" class="linklike" data-i18n="setup.copyPass" hidden></button>
      </div>
    </div>
    <div class="field">
      <label class="label" for="setupPass2" data-i18n="setup.pass2"></label>
      <input type="password" id="setupPass2" class="input" autocomplete="new-password" autocapitalize="off"
             autocorrect="off" spellcheck="false">
    </div>
    <p class="callout callout-warn"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-i18n="setup.warn"></span></p>
    <p class="hint subtle"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-clock"/></svg><span data-i18n="setup.workingHint"></span></p>
    <p class="form-error" id="setupError" role="alert" hidden></p>
    <button type="submit" id="setupSubmit" class="btn btn-primary btn-block" data-i18n="setup.submit"></button>
  </form>
</dialog>

<dialog id="dlgContact" class="sheet">
  <div class="sheet-head">
    <h2 data-i18n="con.add"></h2>
    <button type="button" class="icon-btn" data-close data-i18n-label="action.close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <form id="contactForm" class="sheet-body stack" novalidate>
    <div class="field">
      <label class="label" for="contactInput" data-i18n="con.add.input"></label>
      <textarea id="contactInput" class="input textarea mono" rows="3" autocapitalize="off" autocorrect="off"
                spellcheck="false" data-i18n-placeholder="con.add.ph"></textarea>
    </div>
    <div class="preview" id="contactPreview" hidden></div>
    <div class="field">
      <label class="label" for="contactName" data-i18n="con.add.name"></label>
      <input type="text" id="contactName" class="input" maxlength="64" data-i18n-placeholder="con.add.name.ph">
    </div>
    <p class="form-error" id="contactError" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary btn-block" data-i18n="con.add.submit"></button>
  </form>
</dialog>

<dialog id="dlgDetail" class="sheet">
  <div class="sheet-head">
    <h2 id="detailTitle"></h2>
    <button type="button" class="icon-btn" data-close data-i18n-label="action.close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body stack" id="detailBody"></div>
</dialog>

<dialog id="dlgSettings" class="sheet">
  <div class="sheet-head">
    <h2 data-i18n="set.title"></h2>
    <button type="button" class="icon-btn" data-close data-i18n-label="action.close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body stack">
    <section class="setting">
      <p class="label" data-i18n="set.appearance"></p>
      <div class="segmented" id="themeSeg" role="group">
        <button type="button" data-theme-val="system" data-i18n="set.theme.system"></button>
        <button type="button" data-theme-val="light" data-i18n="set.theme.light"></button>
        <button type="button" data-theme-val="dark" data-i18n="set.theme.dark"></button>
      </div>
    </section>
    <section class="setting">
      <p class="label" data-i18n="set.lang"></p>
      <div class="segmented" id="langSeg" role="group">
        <button type="button" data-lang-val="de">Deutsch</button>
        <button type="button" data-lang-val="en">English</button>
      </div>
    </section>
    <section class="setting">
      <label class="label" for="autolockSel" data-i18n="set.autolock"></label>
      <select id="autolockSel" class="input select">
        <option value="1" data-i18n="set.autolock.1"></option>
        <option value="5" data-i18n="set.autolock.5"></option>
        <option value="15" data-i18n="set.autolock.15"></option>
        <option value="60" data-i18n="set.autolock.60"></option>
        <option value="0" data-i18n="set.autolock.0"></option>
      </select>
      <p class="hint" data-i18n="set.autolock.hint"></p>
    </section>
    <hr class="rule">
    <section class="setting">
      <p class="label" data-i18n="set.backup"></p>
      <p class="hint" data-i18n="set.backup.hint"></p>
      <div class="btn-row">
        <button type="button" id="btnExport" class="btn btn-quiet">
          <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="set.backup.export"></span>
        </button>
        <button type="button" id="btnImport" class="btn btn-quiet">
          <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="set.backup.import"></span>
        </button>
      </div>
      <textarea id="backupOut" class="input textarea mono cipher" rows="4" readonly hidden></textarea>
    </section>
    <hr class="rule">
    <section class="setting">
      <p class="label" data-i18n="set.pass"></p>
      <form id="passForm" class="stack" novalidate>
        <input type="password" id="passOld" class="input" autocomplete="current-password" autocapitalize="off"
               spellcheck="false" data-i18n-placeholder="set.pass.old">
        <input type="password" id="passNew" class="input" autocomplete="new-password" autocapitalize="off"
               spellcheck="false" data-i18n-placeholder="set.pass.new">
        <p class="form-error" id="passError" role="alert" hidden></p>
        <button type="submit" class="btn btn-quiet btn-block" data-i18n="set.pass"></button>
      </form>
    </section>
    <hr class="rule">
    <section class="setting">
      <button type="button" id="btnLockNow" class="btn btn-quiet btn-block">
        <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span data-i18n="set.lockNow"></span>
      </button>
    </section>
    <section class="setting">
      <p class="version-row"><span data-i18n="set.version"></span> <span class="mono" id="appVersion"></span></p>
    </section>
    <hr class="rule">
    <section class="setting danger">
      <p class="label" data-i18n="set.danger"></p>
      <p class="hint" data-i18n="set.danger.hint"></p>
      <button type="button" id="btnPurge" class="btn btn-danger btn-block">
        <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="set.purge"></span>
      </button>
    </section>
    <p class="version mono" id="versionLine"></p>
  </div>
</dialog>

<dialog id="dlgConfirm" class="sheet sheet-compact">
  <div class="sheet-body stack">
    <h2 id="confirmTitle"></h2>
    <p class="muted" id="confirmBody"></p>
    <div class="btn-row btn-row-end">
      <button type="button" id="confirmCancel" class="btn btn-quiet" data-i18n="action.cancel"></button>
      <button type="button" id="confirmOk" class="btn btn-danger"></button>
    </div>
  </div>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
